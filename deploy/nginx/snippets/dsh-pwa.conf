# dsh.kaogong.art — PWA surface (installable web app)
#
# 为什么需要这一段：Chrome 抓取 web app manifest 与 manifest 里的图标时
# **不带 cookie**（credentials omitted，即使同源也一样）。本站 server 级有
# `auth_request /_dsh_gate;`，匿名请求 manifest 会被打回登录页 HTML，
# 于是 Chrome 判定"这不是可安装的应用"，菜单里只剩"创建快捷方式"。
#
# 这里只把 PWA 门面（manifest + 图标 + favicon）从门禁里放行，
# 其余所有路径（含 /assets/、/ 本身）仍然照旧需要 dsh_gate cookie。
# 放行内容全是静态品牌资源，不含任何会话/业务数据。

location = /manifest.webmanifest {
    auth_request off;
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=300";
    alias /var/www/dsh-pwa/manifest.webmanifest;
}

location ^~ /icons/ {
    auth_request off;
    add_header Cache-Control "public, max-age=604800";
    alias /var/www/dsh-pwa/icons/;
}

location = /favicon.svg {
    auth_request off;
    add_header Cache-Control "public, max-age=604800";
    alias /var/www/dsh-pwa/icons/favicon.svg;
}

location = /favicon-dark.svg {
    auth_request off;
    add_header Cache-Control "public, max-age=604800";
    alias /var/www/dsh-pwa/icons/favicon-dark.svg;
}
